<style>
    :root {
        --bg-white: #ffffff;
        --text-dark: #222;
    }

    .jornada-organizadores {
        padding: 60px 20px;
        max-width: 1200px;
        margin: 0 auto;
        text-align: center;
    }

    .section-title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 45px;
        color: #333;
    }

    .organizadores-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 42px;
        align-items: start;
    }

    .organizadores-columna {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .organizadores-subtitulo {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #333;
        margin: 0 0 28px;
    }

    .logos-grupo {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 28px;
        flex-wrap: wrap;
        width: 100%;
    }

    .logo-item {
        width: 120px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-item a {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-item img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
    }

    /* NUEVA CLASE ESPECÍFICA PARA EL LOGO APALANCADO */
    .logo-auspiciante {
        width: 180px; /* Aumentamos el ancho total del contenedor */
        height: auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-auspiciante img {
        width: 100%;   /* Forzamos a ocupar todo el ancho */
        height: auto;  /* Mantiene la proporción perfecta */
        transform: scale(1.2); /* Un extra de escala visual */
    }

    @media (max-width: 900px) {
        .organizadores-grid {
            grid-template-columns: 1fr;
            gap: 44px;
        }

        .organizadores-subtitulo {
            margin-bottom: 22px;
        }
    }

    @media (max-width: 768px) {
        .jornada-organizadores {
            padding: 40px 15px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 35px;
        }

        .logos-grupo {
            gap: 24px;
        }

        .logo-item {
            width: 95px;
            height: 58px;
        }

        /* Ajuste responsivo para el logo del auspiciante */
        .logo-auspiciante {
            width: min(85vw, 260px);
        }
    }
</style>
